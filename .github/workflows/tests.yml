name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run offline PowerShell tests
        shell: pwsh
        run: .\Tests\Test-IntuneDeviceWorkbench.ps1

      - name: Verify native clipboard cleanup with synthetic data
        shell: pwsh
        run: |
          pwsh.exe -NoLogo -NoProfile -STA -File .\Tests\Test-NativeClipboard.ps1 -AllowClipboardOverwrite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Render synthetic demo preview
        shell: pwsh
        run: |
          pwsh.exe -NoLogo -NoProfile -NonInteractive -STA -File .\IntuneDeviceWorkbench.ps1 -DemoMode -RenderPreviewPath "$env:RUNNER_TEMP\device-recovery.png"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save synthetic demo preview for visual review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-device-preview
          path: ${{ runner.temp }}/device-recovery.png
          if-no-files-found: error
          retention-days: 3
