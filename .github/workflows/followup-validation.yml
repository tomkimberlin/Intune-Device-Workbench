name: Follow-up compatibility and accessibility validation
on:
  push:
    branches: [codex/followup-validation]
permissions:
  contents: read
jobs:
  demo-window:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exercise the full demo window with an isolated Graph boundary
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'demo-baseline'
          git worktree add --detach $baseline d90a9a9bee531b275f72a523cba778841a1b9474
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh.exe -NoLogo -NoProfile -MTA -File .\Validation\Test-DemoWindow.ps1 -RepositoryPath $baseline -ExpectedGraphReads 4 -OutputPath "$env:RUNNER_TEMP\demo-before.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh.exe -NoLogo -NoProfile -MTA -File .\Validation\Test-DemoWindow.ps1 -RepositoryPath "$pwd" -ExpectedGraphReads 0 -OutputPath "$env:RUNNER_TEMP\demo-after.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save synthetic demo observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: synthetic-demo-observations
          path: ${{ runner.temp }}/demo-*.json
          if-no-files-found: warn
          retention-days: 3
