name: Follow-up compatibility and accessibility validation
on:
  push:
    branches: [codex/followup-validation]
permissions:
  contents: read
jobs:
  live-status-transport:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exercise real WPF to UI Automation event delivery with synthetic text
        shell: pwsh
        run: |
          $PSVersionTable | Format-Table
          $baseline = Join-Path $env:RUNNER_TEMP 'IntuneDeviceWorkbench-before.ps1'
          git show d90a9a9bee531b275f72a523cba778841a1b9474:IntuneDeviceWorkbench.ps1 | Set-Content $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh.exe -NoLogo -NoProfile -MTA -File .\Validation\Test-LiveStatusTransport.ps1 -SourcePath $baseline -ExpectBaselineFailure -OutputPath "$env:RUNNER_TEMP\uia-before.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh.exe -NoLogo -NoProfile -MTA -File .\Validation\Test-LiveStatusTransport.ps1 -SourcePath "$pwd\IntuneDeviceWorkbench.ps1" -OutputPath "$env:RUNNER_TEMP\uia-after.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save synthetic UI Automation observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: synthetic-uia-observations
          path: ${{ runner.temp }}/uia-*.json
          if-no-files-found: warn
          retention-days: 3
