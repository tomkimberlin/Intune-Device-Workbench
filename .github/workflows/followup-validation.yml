name: Follow-up inventory scale validation
on:
  push:
    branches: [codex/followup-validation]
permissions:
  contents: read
jobs:
  inventory-scale:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Measure actual desktop loading and filtering with synthetic inventories
        shell: pwsh
        run: |
          pwsh.exe -NoLogo -NoProfile -File .\Validation\Test-InventoryScale.ps1 -OutputPath "$env:RUNNER_TEMP\inventory-scale.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: synthetic-inventory-scale
          path: ${{ runner.temp }}/inventory-scale.json
          if-no-files-found: error
          retention-days: 3
